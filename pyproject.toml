[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-screen"
version = "0.2.0"
description = "Screening-grade tools for geologic CO2 storage: capacity, pressure, and uncertainty."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
# Reading the GEOTHOPICA workbook is the only thing that needs openpyxl, so the
# screening engine stays installable without it.
ingest = ["openpyxl>=3.1"]
# The HTTP layer. uvicorn is the ASGI server; nothing else is needed to serve.
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
    "pytest>=8.0",
    "openpyxl>=3.1",
    "tomli>=2.0; python_version<'3.11'",
    # fastapi.testclient is built on httpx
    "fastapi>=0.110",
    "httpx>=0.27",
]

[project.scripts]
ccs-screen = "ccs_screen.cli:main"
ccs-ingest = "ccs_screen.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
