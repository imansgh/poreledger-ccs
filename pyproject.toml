[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccs-screen"
version = "0.2.0"
description = "Screening-grade tools for geologic CO2 storage: capacity, pressure, and uncertainty."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
# Reading the GEOTHOPICA workbook is the only thing that needs openpyxl, so the
# screening engine stays installable without it.
ingest = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "openpyxl>=3.1", "tomli>=2.0; python_version<'3.11'"]

[project.scripts]
ccs-screen = "ccs_screen.cli:main"
ccs-ingest = "ccs_screen.ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
